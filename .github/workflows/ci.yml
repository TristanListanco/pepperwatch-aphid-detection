# Test every push and pull request, then promote green commits on main to
# the `stable` branch.
#
# The Pi deploys from `stable` (websystem/deploy/update.sh), never from `main`,
# so a commit only reaches the field device after every job below has passed
# on it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Explicit so steps run with -o pipefail.
    shell: bash
    working-directory: websystem

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is Raspberry Pi OS Bookworm's Python and 3.13 is Trixie's; 3.10
        # is Ubuntu 22.04's, the base of many Orange Pi and Banana Pi images.
        # The arm64 runner has these boards' architecture, so a missing
        # onnxruntime or opencv wheel for aarch64 fails here, not on a device.
        python: ["3.10", "3.11", "3.13"]
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # The repository carries ~4 GB of field photographs no test needs.
          sparse-checkout: websystem
          filter: blob:none

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: websystem/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and API tests
        run: python -m pytest -q -rs

  lint:
    name: Lint (JavaScript, shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: websystem
          filter: blob:none

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Dashboard modules parse as ES modules
        run: bash scripts/check_js.sh

      - name: Shell scripts
        run: |
          shellcheck --version
          shellcheck -S warning deploy/*.sh deploy/network/*.sh scripts/*.sh

  promote:
    name: Promote to stable
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Fast-forward stable to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --silent 2>/dev/null; then
            # force=false accepts only a fast-forward, so a slow run that
            # finishes after a newer one can never move stable backwards.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" \
              -f sha="$GITHUB_SHA" -F force=false --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/stable -f sha="$GITHUB_SHA" --silent
          fi
          echo "stable → \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
