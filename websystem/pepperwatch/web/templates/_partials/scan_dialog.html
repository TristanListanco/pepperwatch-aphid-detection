{# Lightbox for a single archived scan. The image is annotated server-side, so
   it stands alone without the live overlay stream. #}
<dialog data-scan-dialog aria-label="Scan detail">
  <img data-dialog-image alt="">
  <div class="dialog-meta" data-dialog-meta></div>
  <div class="dialog-meta" style="border-top:1px solid var(--line); display:flex; gap:8px;">
    <button class="btn is-quiet" type="button" data-dialog-close>Close</button>
  </div>
</dialog>
