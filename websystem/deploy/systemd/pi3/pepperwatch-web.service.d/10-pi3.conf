# Raspberry Pi 3 overrides for the dashboard.
#
# Installed to /etc/systemd/system/pepperwatch-web.service.d/10-pi3.conf
#
# See the worker drop-in for the full memory budget. Gunicorn with one process
# and sixteen threads is modest, but each MJPEG viewer holds a buffer and each
# SSE client a queue, so the ceiling is real rather than theoretical.

[Service]
MemoryHigh=140M
MemoryMax=200M

# Fewer threads than the Pi 5's sixteen. The profile caps concurrent streams at
# two viewers and six SSE clients, so sixteen threads would only be stack
# allocations doing nothing.
ExecStart=
ExecStart=/opt/pepperwatch/.venv/bin/gunicorn \
    --workers 1 \
    --threads 6 \
    --worker-class gthread \
    --bind 0.0.0.0:8000 \
    --timeout 0 \
    --graceful-timeout 10 \
    --access-logfile - \
    --error-logfile - \
    pepperwatch.web.wsgi:app

# Above the worker's 60: the dashboard must stay responsive while inference
# runs, because an unresponsive dashboard looks like a crashed system.
CPUWeight=120
