# Memory limits for the inference worker on boards with about 1 GB of RAM
# (768 MB to 1.5 GB): Raspberry Pi 3, 1 GB Pi 4, Orange Pi Zero 3 1 GB,
# Banana Pi M4 Zero, and the like. install.sh picks this set by RAM.
#
# Installed to /etc/systemd/system/pepperwatch-worker.service.d/10-memory.conf
#
# The base unit's MemoryMax=2G was sized for a Pi 5 with 4 GB or more. On a 1 GB board
# that limit sits far above physical memory, so it never engages -- the kernel's
# OOM killer fires first, and it picks its victim by heuristic rather than by
# our intent. These values put the ceiling back below RAM so systemd reclaims
# and, if it must, kills the right process.
#
# Budget on a 1 GB board (≈940 MB visible on a Pi 3 after the GPU split):
#     OS + NetworkManager + mosquitto + sshd   ~150 MB
#     worker (this unit)                        460 MB max
#     web                                       200 MB max
#                                              --------
#                                               810 MB, leaving ~130 MB headroom

[Service]
# MemoryHigh throttles and reclaims first; MemoryMax is the hard stop. Having
# both means sustained pressure slows the worker down rather than killing it,
# and only a genuine runaway hits the ceiling.
MemoryHigh=360M
MemoryMax=460M

# Two of four cores, matching config/profiles/low.toml. A later Environment=
# assignment wins over the base unit's.
Environment=OMP_NUM_THREADS=2

# The worker will happily saturate all four cores. Weighting the web
# process above it keeps the dashboard answering while inference runs --
# on a board this slow that is the difference between "loading" and "hung".
CPUWeight=60

# Restart a little more slowly. On a board this constrained a crash loop is
# usually memory pressure, and hammering restarts makes it worse.
RestartSec=10
