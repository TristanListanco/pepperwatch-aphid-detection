# Memory limits for the dashboard on boards with under 768 MB of RAM.
#
# Installed to /etc/systemd/system/pepperwatch-web.service.d/10-memory.conf
#
# See the worker drop-in for the full budget. The tiny profile allows one
# MJPEG viewer and four SSE clients, so four threads are enough.

[Service]
MemoryHigh=80M
MemoryMax=100M

ExecStart=
ExecStart=/opt/pepperwatch/.venv/bin/gunicorn \
    --workers 1 \
    --threads 4 \
    --worker-class gthread \
    --bind 0.0.0.0:8000 \
    --timeout 0 \
    --graceful-timeout 10 \
    --access-logfile - \
    --error-logfile - \
    pepperwatch.web.wsgi:app

CPUWeight=120
