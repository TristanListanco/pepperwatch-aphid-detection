# Memory limits for the inference worker on boards with under 768 MB of RAM:
# Raspberry Pi Zero 2 W (512 MB) and the like. Best effort: the pipeline fits,
# with little to spare. install.sh picks this set by RAM, and enables zram.
#
# Installed to /etc/systemd/system/pepperwatch-worker.service.d/10-memory.conf
#
# Budget on a 512 MB board (≈440 MB visible), on a headless Lite image:
#     OS + NetworkManager + mosquitto + sshd    ~90 MB
#     worker (this unit)                        240 MB max
#     web                                       100 MB max
#                                              --------
#                                               430 MB. Tight: zram absorbs
#                                               short peaks. Not measured on
#                                               hardware yet; check with doctor.

[Service]
# MemoryHigh throttles and reclaims first; MemoryMax is the hard stop.
MemoryHigh=200M
MemoryMax=240M

# Two of four cores, matching config/profiles/tiny.toml.
Environment=OMP_NUM_THREADS=2

# Keep the dashboard answering while inference saturates the CPU.
CPUWeight=60

# A crash loop here is almost always memory pressure; back off.
RestartSec=15
