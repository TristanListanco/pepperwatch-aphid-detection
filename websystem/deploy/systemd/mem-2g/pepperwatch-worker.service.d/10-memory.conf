# Memory limits for the inference worker on boards with 1.5 to 3 GB of RAM:
# 2 GB Raspberry Pi 4 or Pi 5, Orange Pi Zero 3 2 GB, Banana Pi M4 Berry, and
# the like. install.sh picks this set by RAM.
#
# Installed to /etc/systemd/system/pepperwatch-worker.service.d/10-memory.conf
#
# The base units' 2G + 1G is more than a 2 GB board has, so those limits would
# never engage and the kernel's OOM killer would act first instead.
#
# Budget on a 2 GB board (≈1.9 GB visible):
#     OS + NetworkManager + mosquitto + sshd   ~250 MB
#     worker (this unit)                       1000 MB max
#     web                                       400 MB max
#                                              --------
#                                              1650 MB, leaving ~250 MB headroom

[Service]
# MemoryHigh throttles and reclaims first; MemoryMax is the hard stop.
MemoryHigh=850M
MemoryMax=1000M
