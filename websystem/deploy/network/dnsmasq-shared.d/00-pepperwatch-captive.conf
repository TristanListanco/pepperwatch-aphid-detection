# Captive-portal DNS and DHCP for the Pepper Watch access point.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/00-pepperwatch-captive.conf
# and picked up automatically by the dnsmasq instance that NetworkManager runs
# for an `ipv4.method shared` connection. Editing /etc/dnsmasq.conf instead
# would have no effect: that is a different dnsmasq, and on a stock image it is
# not even running.

# Resolve every name to the Pi. With no upstream DNS this is honest rather than
# hostile -- there is nowhere else for a lookup to go -- and it is what makes a
# device's connectivity probe reach our web server on port 80, which is what
# raises the portal sheet.
#
# No DHCP option 114 (RFC 8910): phones only accept that portal URL over
# HTTPS, and an offline Pi has no certificate a phone would trust.
address=/#/192.168.4.1

# A friendly name, so the device appears as pepperwatch.local rather than an
# address anyone has to remember.
address=/pepperwatch.local/192.168.4.1
address=/pepperwatch/192.168.4.1

# Short leases: phones join for a few minutes while someone checks the crop and
# then leave. Long leases would exhaust the pool over a season of visits.
dhcp-range=192.168.4.50,192.168.4.150,255.255.255.0,2h

# No upstream resolvers to forward to, and saying so explicitly stops dnsmasq
# retrying queries that can never be answered.
no-resolv
