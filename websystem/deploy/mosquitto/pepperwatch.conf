# Pepper Watch broker configuration.
# Installed to /etc/mosquitto/conf.d/pepperwatch.conf

# Loopback only. The bus carries telemetry and control commands between two
# local processes; nothing on the access point has any business reaching it, and
# binding to 0.0.0.0 would expose an unauthenticated broker to every phone in
# Wi-Fi range.
listener 1883 127.0.0.1

# Safe precisely because of the listener above: the only clients that can reach
# this socket are already running on the device.
allow_anonymous true

# No on-disk persistence. Retained messages are cheap to republish at startup,
# and an 8-hour cycle of telemetry writes is exactly the kind of steady small
# I/O that wears out an SD card.
persistence false

# Keep the journal readable; the broker is not the interesting part of the logs.
log_dest stderr
log_type warning
log_type error

# The retained detector-status and worker-status messages are tiny; this simply
# stops a misbehaving client from queueing anything large.
message_size_limit 262144
max_queued_messages 200
